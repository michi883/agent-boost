<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Boost</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0e14'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%2360a5fa'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1 class="brand">Agent Boost</h1>
      <span id="viewport-status" class="status-badge" data-state="empty">16:9 Viewport</span>
    </header>

    <main class="stage">
      <section
        id="slide-viewport"
        class="slide-viewport"
        data-state="empty"
        aria-label="16:9 Slide Viewport"
      >
        <div id="slide-placeholder" class="slide-placeholder" role="status" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <p class="placeholder-title">Ready for Gemma</p>
          <p class="placeholder-subtitle">16:9 slide viewport</p>
        </div>

        <iframe
          id="slide-frame"
          class="slide-frame"
          title="Slide viewport"
          sandbox="allow-scripts allow-same-origin"
          hidden
        ></iframe>
      </section>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
