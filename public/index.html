<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Boost</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0e14'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%2360a5fa'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1 class="brand">Agent Boost</h1>
      <form id="neon-form" class="neon-form">
        <input id="neon-prompt" class="neon-prompt" type="text" value="Integrate 3D visualization" maxlength="500" aria-label="Prompt for Gemini Neon" required>
        <button id="neon-button" class="neon-button" type="submit">Improve with Neon</button>
        <span id="neon-status" class="neon-status" data-state="idle" aria-live="polite"></span>
      </form>
    </header>

    <main class="stage">
      <section class="panel" data-panel="original" data-src="/gemma-slide.html">
        <div class="panel-inner">
          <div class="panel-label">
            <span class="panel-title">Original <span class="panel-model">Gemma 31B</span></span>
            <span class="status-badge" data-state="empty">Waiting</span>
          </div>
          <div class="slide-viewport" data-state="empty">
            <div class="slide-placeholder" role="status" aria-live="polite">
              <span class="status-dot" aria-hidden="true"></span>
              <p class="placeholder-title">Waiting for Gemma</p>
            </div>
            <iframe class="slide-frame" title="Original slide" sandbox="allow-scripts allow-same-origin" hidden></iframe>
          </div>
        </div>
      </section>

      <section class="panel" data-panel="improved" data-src="/gemini/index.html">
        <div class="panel-inner">
          <div class="panel-label">
            <span class="panel-title">Improved <span class="panel-model">Gemini Neon</span></span>
            <span class="status-badge" data-state="empty">Waiting</span>
          </div>
          <div class="slide-viewport" data-state="empty">
            <div class="slide-placeholder" role="status" aria-live="polite">
              <span class="status-dot" aria-hidden="true"></span>
              <p class="placeholder-title">Waiting for Gemini</p>
            </div>
            <iframe class="slide-frame" title="Improved slide" sandbox="allow-scripts allow-same-origin" hidden></iframe>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
