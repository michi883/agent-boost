<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: radial-gradient(circle at 50% 35%, #0f172a 0%, #030712 100%); color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; }
  #hud { position: fixed; top: 20px; left: 28px; z-index: 10; pointer-events: none; max-width: 75%; }
  #title { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: #f8fafc; text-shadow: 0 2px 16px rgba(56,189,248,0.4); }
  #subtitle { margin: 4px 0 0; font-size: 13px; color: #94a3b8; }
  #hint { position: fixed; bottom: 14px; right: 20px; z-index: 10; pointer-events: none; font-size: 11px; color: #64748b; letter-spacing: 0.04em; }
  .card { width: 190px; padding: 10px 12px; border-radius: 10px; background: rgba(8, 13, 26, 0.84); border: 1px solid rgba(148, 163, 184, 0.25); backdrop-filter: blur(8px); box-shadow: 0 8px 24px rgba(0,0,0,0.45); pointer-events: auto; transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s; }
  .card.active { transform: scale(1.06); border-color: var(--accent); box-shadow: 0 0 22px var(--glow); }
  .badge { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); }
  .theme { margin: 2px 0 6px; font-size: 13px; font-weight: 600; color: #f1f5f9; line-height: 1.25; }
  .pts { margin: 0; padding-left: 14px; font-size: 11px; color: #cbd5e1; line-height: 1.38; }
  .pts li + li { margin-top: 2px; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="hud"><h1 id="title"></h1><p id="subtitle"></p></div>
<div id="hint">Drag to orbit · Scroll to zoom · Hover milestones</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const DATA = {"title":"2027 GTM Strategy","subtitle":"Scaling global market penetration and revenue growth","items":[{"label":"Q1","theme":"Market Entry","points":["Targeted beta launch","Initial user acquisition","Channel partner setup"]},{"label":"Q2","theme":"Growth Phase","points":["Scale paid media","Optimize conversion funnels","Expand regional reach"]},{"label":"Q3","theme":"Product Maturity","points":["Feature set expansion","Enterprise tier rollout","Churn reduction focus"]},{"label":"Q4","theme":"Market Dominance","points":["Global brand awareness","Strategic ecosystem integration","Maximized LTV growth"]}]};
document.getElementById('title').textContent = DATA.title;
document.getElementById('subtitle').textContent = DATA.subtitle;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 1.6, 12.2);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', top: '0', left: '0', pointerEvents: 'none' });
document.body.appendChild(labelRenderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 0.2, 0);

scene.add(new THREE.AmbientLight(0x94a3b8, 1.1));
const keyLight = new THREE.PointLight(0x38bdf8, 28, 35);
keyLight.position.set(0, 6, 6);
scene.add(keyLight);

const grid = new THREE.GridHelper(28, 28, 0x1e3a8a, 0x0f172a);
grid.position.y = -2.6;
scene.add(grid);

const starPos = new Float32Array(900);
for (let i = 0; i < 900; i++) starPos[i] = (Math.random() - 0.5) * 40;
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0x64748b, size: 0.07 })));

const palette = ['#38bdf8', '#818cf8', '#34d399', '#f472b6', '#fbbf24', '#a78bfa', '#2dd4bf', '#fb7185'];
const n = DATA.items.length;
const span = Math.min(13.5, Math.max(5, (n - 1) * 2.5));
const nodes = [];
const points = [];

DATA.items.forEach((item, i) => {
  const t = n > 1 ? i / (n - 1) : 0.5;
  const pos = new THREE.Vector3((t - 0.5) * span, -1.1 + t * 1.9, Math.sin(i * 1.25) * 1.35);
  points.push(pos);
  const color = palette[i % palette.length];

  const group = new THREE.Group();
  group.position.copy(pos);
  const core = new THREE.Mesh(
    new THREE.OctahedronGeometry(0.32, 0),
    new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.55, roughness: 0.2, metalness: 0.6 })
  );
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(0.52, 0.025, 12, 40),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.7 })
  );
  ring.rotation.x = Math.PI / 2.4;
  const pillar = new THREE.Mesh(
    new THREE.CylinderGeometry(0.015, 0.015, pos.y + 2.6, 8),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.35 })
  );
  pillar.position.y = -(pos.y + 2.6) / 2;
  group.add(core, ring, pillar);
  scene.add(group);

  const card = document.createElement('div');
  card.className = 'card';
  card.style.setProperty('--accent', color);
  card.style.setProperty('--glow', color + '55');
  const badge = document.createElement('div');
  badge.className = 'badge';
  badge.textContent = item.label || `Step ${i + 1}`;
  const theme = document.createElement('div');
  theme.className = 'theme';
  theme.textContent = item.theme;
  const ul = document.createElement('ul');
  ul.className = 'pts';
  item.points.forEach((pt) => {
    const li = document.createElement('li');
    li.textContent = pt;
    ul.appendChild(li);
  });
  card.append(badge, theme, ul);

  const label = new CSS2DObject(card);
  const yOff = n > 4 ? (i % 2 === 0 ? 1.15 : -1.15) : 1.1;
  label.position.set(0, yOff, 0);
  group.add(label);

  const node = { core, ring, card, idx: i };
  card.addEventListener('mouseenter', () => (hovered = i));
  card.addEventListener('mouseleave', () => { if (hovered === i) hovered = -1; });
  nodes.push(node);
});

if (points.length >= 2) {
  const curve = new THREE.CatmullRomCurve3(points);
  scene.add(new THREE.Mesh(
    new THREE.TubeGeometry(curve, 80, 0.045, 10, false),
    new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.55 })
  ));
}

let hovered = -1;
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
renderer.domElement.addEventListener('pointermove', (e) => {
  pointer.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(nodes.map((x) => x.core));
  hovered = hits.length ? nodes.findIndex((x) => x.core === hits[0].object) : -1;
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
(function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  nodes.forEach((node, i) => {
    const active = hovered === i;
    node.core.rotation.y = t * 0.7 + i;
    node.ring.rotation.z = t * (active ? 1.8 : 0.5) + i;
    const s = active ? 1.35 : 1 + Math.sin(t * 2 + i) * 0.06;
    node.core.scale.setScalar(s);
    node.card.classList.toggle('active', active);
  });
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
})();
</script>
</body>
</html>
